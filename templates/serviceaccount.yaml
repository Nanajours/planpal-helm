{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.backend }}
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.frontend }}
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
{{- end }}
