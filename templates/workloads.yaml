{{- range $name, $w := .Values.workloads }}
{{- if $w.enabled }}
---
{{ include "planpal.workload" (dict "root" $ "name" $name "w" $w) }}
{{- with $w.service }}
---
{{ include "planpal.service" (dict "root" $ "name" $name "svc" .) }}
{{- end }}
{{- if and $w.rollout $w.rollout.enabled (ne ($w.rollout.strategy | default "blueGreen") "canary") }}
---
{{ include "planpal.service" (dict "root" $ "name" $name "svc" (dict
     "name" ($w.rollout.previewService | default (printf "%s-preview" $name))
     "ports" $w.service.ports)) }}
{{- end }}
{{- if and $w.hpa $w.hpa.enabled }}
---
{{ include "planpal.hpa" (dict "root" $ "name" $name "w" $w) }}
{{- end }}
{{- if and $w.pdb $w.pdb.enabled }}
---
{{ include "planpal.pdb" (dict "root" $ "name" $name "w" $w) }}
{{- end }}
{{- end }}
{{- end }}
