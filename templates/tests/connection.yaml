{{- if .Values.tests.enabled }}
{{- /* `helm test planpal` runs this Pod and reports pass or fail from its exit
       code. It replaces the hand-typed kubectl run that used to live in
       NOTES.txt, and it proves the Service, the Pods and the database wiring
       all work rather than just that the Pods are Running. */}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "planpal.fullname" . }}-test-connection
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: {{ .Values.tests.image }}
      command: [curl]
      {{- /* -f turns a non-2xx response into a non-zero exit code. */}}
      args:
        - -sSf
        - http://server:{{ (index .Values.workloads.server.service.ports 0).port }}/api/v1/health
{{- end }}
