{{- /* PodDisruptionBudgets guard voluntary disruptions only: kubectl drain,
       node upgrades. They are not consulted during a rolling update, which is
       governed by maxUnavailable in the Deployment strategy. */}}
{{- if .Values.server.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: server-pdb
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.server.pdb.minAvailable }}
  selector:
    matchLabels: { app: server }
{{- end }}
{{- if .Values.frontend.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.frontend.pdb.minAvailable }}
  selector:
    matchLabels: { app: frontend }
{{- end }}
