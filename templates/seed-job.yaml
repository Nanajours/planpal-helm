{{- if .Values.seedJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-admin-{{ .Release.Revision }}
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: { app: seed-admin }
    spec:
      serviceAccountName: {{ .Values.serviceAccount.backend }}
      restartPolicy: Never
      containers:
        - name: seed-admin
          image: {{ include "planpal.image" (dict "root" . "w" (merge (dict "tag" (.Values.seedJob.tag | default .Values.workloads.server.tag)) .Values.seedJob)) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toYaml .Values.seedJob.command | nindent 12 }}
          envFrom:
            - configMapRef: { name: planpal-config }
            - secretRef: { name: planpal-secret }
            - secretRef: { name: planpal-seed-admin-secret }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: planpal-secret, key: SECRET_DATABASE_URL }
{{- end }}
