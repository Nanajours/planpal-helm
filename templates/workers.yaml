{{- /* All three workers share one image and one shape. They differ only by
       entrypoint and metrics port, so the Deployment is generated in a loop
       rather than written out three times. */}}
{{- $root := . }}
{{- range $key, $w := .Values.workers }}
{{- if and (kindIs "map" $w) $w.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $key }}-worker
  labels:
    {{- include "planpal.labels" $root | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ $key }}-worker }
  template:
    metadata:
      labels: { app: {{ $key }}-worker }
    spec:
      serviceAccountName: {{ $root.Values.serviceAccount.backend }}
      containers:
        - name: {{ $key }}-worker
          image: {{ include "planpal.image" (list $root $root.Values.image.worker $root.Values.image.tag) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- with $w.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef: { name: planpal-config }
            - secretRef: { name: planpal-secret }
          resources:
            {{- toYaml $root.Values.workers.resources | nindent 12 }}
          {{- /* Workers serve no traffic, so /metrics doubles as the health signal. */}}
          readinessProbe:
            httpGet: { path: /metrics, port: {{ $w.metricsPort }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /metrics, port: {{ $w.metricsPort }} }
            initialDelaySeconds: 10
            periodSeconds: 15
{{- end }}
{{- end }}
