apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      serviceAccountName: {{ .Values.serviceAccount.frontend }}
      containers:
        - name: frontend
          image: {{ include "planpal.image" (list . .Values.image.frontend .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.frontend.port }} }]
          envFrom:
            - secretRef: { name: planpal-frontend-secret }
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.frontend.port }} }
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: {{ .Values.frontend.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
