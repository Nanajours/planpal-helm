{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.storeName }}
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
{{- $store := .Values.externalSecrets.storeName }}
{{- $src := .Values.externalSecrets.awsSecretName }}
{{- $refresh := .Values.externalSecrets.refreshInterval }}
{{- $labels := include "planpal.labels" . }}
{{- $secrets := dict
    "planpal-secret" (list "POSTGRES_PASSWORD" "SECRET_DATABASE_URL" "SECRET_JWT_SECRET" "SECRET_AI_API_KEY" "SECRET_GOOGLE_CLIENT_SECRET" "SECRET_SMTP_USERNAME" "SECRET_SMTP_PASSWORD" "SECRET_FCM_SERVICE_ACCOUNT_JSON" "SECRET_SLACK_SIGNING_SECRET" "SECRET_SLACK_BOT_TOKEN")
    "planpal-frontend-secret" (list "SECRET_FIREBASE_API_KEY" "SECRET_FIREBASE_AUTH_DOMAIN" "SECRET_FIREBASE_PROJECT_ID" "SECRET_FIREBASE_STORAGE_BUCKET" "SECRET_FIREBASE_MESSAGING_SENDER_ID" "SECRET_FIREBASE_APP_ID" "SECRET_FIREBASE_MEASUREMENT_ID" "SECRET_FIREBASE_VAPID_KEY")
    "planpal-seed-admin-secret" (list "SEED_ADMIN_EMAIL" "SEED_ADMIN_PASSWORD" "SEED_ADMIN_NAME")
}}
{{- range $name, $keys := $secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $store }}
    kind: SecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    {{- range $keys }}
    - secretKey: {{ . }}
      remoteRef: { key: {{ $src }}, property: {{ . }} }
    {{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: planpal-tls-secret
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: SecretStore
  target:
    name: planpal-tls-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef: { key: {{ .Values.externalSecrets.awsSecretName }}, property: TLS_CRT }
    - secretKey: tls.key
      remoteRef: { key: {{ .Values.externalSecrets.awsSecretName }}, property: TLS_KEY }
{{- end }}
