
nameOverride: ""
fullnameOverride: ""

image:
  registry: 134604498185.dkr.ecr.ap-southeast-3.amazonaws.com
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: true
  backend: planpal
  frontend: planpal-fe

config:
  POSTGRES_DB: planpal
  POSTGRES_USER: planpal
  APP__NATS__URL: nats://nats:4222
  APP__REDIS__URL: redis://redis:6379
  APP__GOOGLE__CLIENT_ID: local-dummy-client-id
  APP__EMAIL__PROVIDER: ses
  APP__SMTP__FROM: vctamsil26@dev1.idserve.net
  APP__AI__PROVIDER: deepseek
  APP__AI__MODEL_ID: claude-opus
  APP__AI__API_BASE_URL: https://llm.devopsinstitute.id/v1/chat/completions

externalSecrets:
  enabled: true
  region: ap-southeast-3
  awsSecretName: ch4-g3-secret-nar
  refreshInterval: 1h
  storeName: aws-secretsmanager

workloads:

  server:
    enabled: true
    image: ch4-g3-nar/server
    replicas: 2
    strategy: RollingUpdate
    rollout:
      enabled: false
      strategy: blueGreen
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
    serviceAccount: planpal
    configMaps: [planpal-config]
    secrets: [planpal-secret]
    ports: [8088]
    preStopSleep: 5
    probe: { path: /api/v1/health, port: 8088 }
    service:
      ports: [{ port: 8088 }]
    resources:
      requests: { cpu: 100m, memory: 150Mi }
      limits: { cpu: 500m, memory: 384Mi }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1

  frontend:
    enabled: true
    image: ch4-g3-nar/frontend
    replicas: 2
    strategy: RollingUpdate
    serviceAccount: planpal-fe
    secrets: [planpal-frontend-secret]
    ports: [3000]
    probe: { path: /, port: 3000, readiness: { periodSeconds: 15 } }
    service:
      name: frontend-service
      ports: [{ port: 3000 }]
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 300m, memory: 256Mi }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1

  schedule-worker:
    enabled: true
    image: ch4-g3-nar/worker
    serviceAccount: planpal
    configMaps: [planpal-config]
    secrets: [planpal-secret]
    probe: { path: /metrics, port: 9091 }
    resources: &workerResources
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

  notification-worker:
    enabled: true
    image: ch4-g3-nar/worker
    serviceAccount: planpal
    configMaps: [planpal-config]
    secrets: [planpal-secret]
    command: [planpal-notification-worker]
    probe: { path: /metrics, port: 9092 }
    resources: *workerResources

  ai-worker:
    enabled: true
    image: ch4-g3-nar/worker
    serviceAccount: planpal
    configMaps: [planpal-config]
    secrets: [planpal-secret]
    command: [planpal-ai-worker]
    probe: { path: /metrics, port: 9093 }
    resources: *workerResources

  postgres:
    enabled: true
    kind: StatefulSet
    registry: ""
    image: postgres
    tag: 16-alpine
    configMaps: [planpal-config]
    secrets: [planpal-secret]
    ports: [5432]
    probe:
      exec: [pg_isready, -U, planpal, -d, planpal]
      liveness: { periodSeconds: 15 }
    service:
      headless: true
      ports: [{ port: 5432 }]
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    persistence:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      storageClass: gp3
      size: 1Gi

  redis:
    enabled: true
    registry: ""
    image: redis
    tag: 7-alpine
    ports: [6379]
    probe:
      exec: [redis-cli, ping]
      readiness: { periodSeconds: 5 }
      liveness: { periodSeconds: 10 }
    service:
      ports: [{ port: 6379 }]
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }

  nats:
    enabled: true
    registry: ""
    image: nats
    tag: 2-alpine
    args: ["-m", "8222"]
    ports: [4222, 8222]
    probe: { path: /healthz, port: 8222 }
    service:
      ports:
        - { name: client, port: 4222 }
        - { name: monitor, port: 8222 }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }

seedJob:
  enabled: true
  image: ch4-g3-nar/server
  command: [seed_admin]

ingress:
  enabled: false
  className: alb
  host: ch4-g3-nar.sandbox.devopsinstitute.id
  certificateArn: ""
  healthcheckPath: /api/v1/health
  groupName: ""
  groupOrder: 10

tests:
  enabled: true
  image: curlimages/curl:8.11.0
