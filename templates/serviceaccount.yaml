{{- if .Values.serviceAccount.create }}
{{- /* Two identities: backend workloads call SES, S3 and Secrets Manager;
       the frontend only needs Secrets Manager. Each is bound to its own IAM
       role by an EKS Pod Identity association created outside this chart. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.backend }}
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.frontend }}
  labels:
    {{- include "planpal.labels" . | nindent 4 }}
{{- end }}
